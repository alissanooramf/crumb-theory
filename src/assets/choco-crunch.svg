<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" width="80" height="80">
  <!-- Elongated finger-shaped chocolate fruit & nut crunch treat 1 (background piece, slightly tilted) -->
  <g stroke="#84634d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back finger crunch body -->
    <path d="M22 28 C20 22 24 16 30 14 L54 22 C60 24 62 30 60 36 L48 64 C46 70 40 72 34 70 L24 64 C18 62 18 56 20 50 Z" fill="#FFF9F0" />
    
    <!-- Top coated chocolate crust line -->
    <path d="M28 17 L52 25 C56 26.5 58 30 57 34 L47 58" stroke-dasharray="1 0.5" />
    
    <!-- Embedded dry fruits and nut chunks in back piece -->
    <!-- Almond sliver -->
    <path d="M32 24 C34 22 38 23 39 26 C37 28 33 27 32 24 Z" fill="#F4E6D2" stroke-width="1" />
    <!-- Pistachio / nut nib -->
    <path d="M44 30 C46 29 48 31 47 33 C45 34 43 32 44 30 Z" fill="#EDE0CA" stroke-width="0.9" />
    <!-- Fruit berry bit -->
    <circle cx="36" cy="35" r="2" fill="#E8D2BA" stroke-width="0.9" />
    <!-- Nut crunch speckles -->
    <circle cx="28" cy="42" r="1.2" fill="#84634d" stroke="none" />
    <circle cx="42" cy="46" r="1.3" fill="#84634d" stroke="none" />
  </g>

  <!-- Elongated finger-shaped chocolate fruit & nut crunch treat 2 (foreground piece, crisp diagonal) -->
  <g stroke="#75523c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Foreground finger bar outline -->
    <path d="M14 42 C12 36 15 30 21 28 L47 16 C53 13 59 16 62 22 L65 30 C67 36 64 42 58 45 L32 58 C26 61 19 58 17 52 Z" fill="#FFFBF5" />
    
    <!-- Delicate chocolate ganache drizzle ripples -->
    <path d="M23 30 Q27 34 31 31 Q35 28 38 32 Q42 35 46 32 Q50 28 54 31" fill="none" stroke-width="1.2" />
    <path d="M19 39 Q24 43 28 40 Q33 37 37 41 Q41 44 46 41 Q50 37 55 41" fill="none" stroke-width="1.1" />
    <path d="M18 48 Q22 51 26 48 Q30 45 34 49 Q38 52 42 49" fill="none" stroke-width="1.1" />

    <!-- Embedded cashew / nut halves -->
    <path d="M28 34 C31 32 35 34 34 38 C31 39 27 37 28 34 Z" fill="#F5E8D4" stroke-width="1" />
    <path d="M42 22 C45 20 49 22 48 26 C45 27 41 25 42 22 Z" fill="#F5E8D4" stroke-width="1" />
    
    <!-- Dried fruit bits (cranberry/raisin jewel) -->
    <path d="M45 35 C48 35 49 38 47 40 C44 41 43 38 45 35 Z" fill="#E8D0B8" stroke-width="1" />
    <circle cx="24" cy="44" r="1.8" fill="#E8D0B8" stroke-width="0.9" />

    <!-- Nut textures / crunch facets -->
    <line x1="36" y1="44" x2="39" y2="46" stroke-width="0.9" />
    <line x1="48" y1="28" x2="52" y2="30" stroke-width="0.9" />
    <line x1="30" y1="24" x2="33" y2="25" stroke-width="0.9" />

    <!-- Hand-drawn crunch crumbs -->
    <circle cx="12" cy="54" r="1" fill="#75523c" stroke="none" />
    <circle cx="15" cy="58" r="0.8" fill="#75523c" stroke="none" />
    <circle cx="58" cy="52" r="1.1" fill="#75523c" stroke="none" />
    <circle cx="62" cy="48" r="0.8" fill="#75523c" stroke="none" />
  </g>
</svg>
